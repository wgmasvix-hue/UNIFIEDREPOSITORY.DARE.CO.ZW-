<header class="dare-masthead" role="banner">
  <div class="dare-masthead__inner">
    <!-- Brand lockup: new DARE Unified Repository logo.
      The image is the full lockup (mark + "DARE / UNIFIED REPOSITORY /
      AFRICA'S KNOWLEDGE, CONNECTED."), so no HTML wordmark is recreated
      next to it. The link carries the accessible name; the image carries
      the required alt text. Sizing/cropping lives in header.component.scss
      via --dare-brand-logo-* variables so the Unified theme can re-skin
      without forking this component. -->
    <a
      class="dare-masthead__brand"
      routerLink="/home"
      aria-label="DARE Unified Repository — home"
    >
      <span class="dare-brand__plate">
        <img
          class="dare-brand__logo"
          src="assets/images/branding/dare-unified-logo.png"
          alt="DARE Unified Repository"
          width="1433"
          height="542"
          decoding="async"
          fetchpriority="high"
          draggable="false"
        />
      </span>
      <span class="dare-brand__fallback">DARE Unified Repository</span>
    </a>

    <!-- Utility row -->
    <div class="dare-masthead__utilities">
      <ds-search-navbar></ds-search-navbar>

      <div
        class="dare-masthead__tools"
        role="toolbar"
        [attr.aria-label]="'nav.user.description' | translate"
      >
        <ds-lang-switch></ds-lang-switch>
        <!--
          Moved into the collapsible navigation below the md breakpoint:
          DSpace's auth menu is ~350px wide and cannot coexist with the wordmark
          on a phone without forcing horizontal scroll. It is re-rendered by the
          navbar at those widths, so sign-in is never lost.
        -->
        <span class="dare-masthead__auth">
          <ds-auth-nav-menu></ds-auth-nav-menu>
        </span>
        <ds-impersonate-navbar></ds-impersonate-navbar>
      </div>

      @if (isMobile$ | async) {
        <button
          class="dare-masthead__toggle"
          type="button"
          (click)="toggleNavbar()"
          aria-controls="collapsingNav"
          [attr.aria-expanded]="(navbarExpanded$ | async) === true"
          [attr.aria-label]="'nav.toggle' | translate"
        >
          <span class="fas fa-bars fa-fw" aria-hidden="true"></span>
          <span class="dare-masthead__toggle-text">Menu</span>
        </button>
      }
    </div>
  </div>
</header>
